version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 (native) and new @types/node majors break @astrojs/check — upgrade deliberately
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
